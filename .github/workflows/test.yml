name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: bash scripts/with-bdl-git-auth.sh
        env:
          BDL_PACKAGES_READ_TOKEN: ${{ secrets.BDL_PACKAGES_READ_TOKEN }}

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      # Feature-branch refs are not built by Vercel (ignoreCommand skips
      # every branch other than preview and main). npm run build is the
      # pre-merge typecheck and Next compile; there is no separate tsc script.
      - name: Build project
        run: npm run build
