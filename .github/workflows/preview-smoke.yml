name: Preview smoke

# Release PR (preview → main): confirm stable preview /login, /players, /events
# respond after Vercel deploy. Manual re-run via workflow_dispatch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}-preview-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Smoke check stable preview
        env:
          PREVIEW_BASE_URL: https://admin-preview.bostondodgeballleague.com
        run: node scripts/smoke-preview.mjs --wait
