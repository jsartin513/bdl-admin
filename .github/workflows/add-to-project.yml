name: Add to BDL project

permissions: {}

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request_target:
    types: [opened, labeled, reopened]

jobs:
  add:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/jsartin513/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: P0, P1, P2, P3
          label-operator: OR
