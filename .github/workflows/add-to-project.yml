name: Add to BDL project
on:
  issues:
    types: [opened, labeled, reopened]
  pull_request_target:
    types: [opened, labeled, reopened]
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/jsartin513/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: P0, P1, P2, P3
          label-operator: OR
